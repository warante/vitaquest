name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Entorno de destino
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        run: railway up --environment ${{ inputs.environment }} --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
